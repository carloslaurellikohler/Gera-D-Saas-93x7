[project]
name = "gera-d-engine"
version = "0.1.0"
description = "Motor de análise 93x7® - Gera D Consultoria"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "openai>=1.55.0",
    "pydantic>=2.13.0",
    "python-docx>=1.2.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
gera-d-engine = "gera_d_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gera_d_engine = ["calibration/*.yaml", "rendering/templates/*"]

[tool.pytest.ini_options]
markers = [
    "slow: marca testes de integração que chamam a API da OpenAI de verdade",
]
