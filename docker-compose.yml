services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gerad}
      POSTGRES_USER: ${POSTGRES_USER:-gerad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gerad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gerad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gerad:gerad@postgres:5432/gerad}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: /data/storage
      DEFAULT_CS_ID: ${DEFAULT_CS_ID:-cs-padrao}
      DEFAULT_CS_NAME: ${DEFAULT_CS_NAME:-Consultor GerAD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      TASK_TIME_LIMIT_SECONDS: ${TASK_TIME_LIMIT_SECONDS:-3600}
      TASK_SOFT_TIME_LIMIT_SECONDS: ${TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      ASSISTANT_CHAT_MODEL: ${ASSISTANT_CHAT_MODEL:-gpt-6-luna}
      ASSISTANT_CHAT_TEMPERATURE: ${ASSISTANT_CHAT_TEMPERATURE:-0.3}
      ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-text-embedding-3-small}
      ASSISTANT_DAILY_MESSAGE_LIMIT: ${ASSISTANT_DAILY_MESSAGE_LIMIT:-30}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
    volumes:
      - storage_data:/data/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gerad:gerad@postgres:5432/gerad}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: /data/storage
      DEFAULT_CS_ID: ${DEFAULT_CS_ID:-cs-padrao}
      DEFAULT_CS_NAME: ${DEFAULT_CS_NAME:-Consultor GerAD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      TASK_TIME_LIMIT_SECONDS: ${TASK_TIME_LIMIT_SECONDS:-3600}
      TASK_SOFT_TIME_LIMIT_SECONDS: ${TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
    volumes:
      - storage_data:/data/storage

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  storage_data:
